
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Меню — QR DINE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 40px;
      border: 1px solid #ddd;
    }
    .cart-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .cart input {
      width: 100%;
      max-width: 350px;
      margin: 12px 0;
    }
    #message {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="index.html">QR<span>DINE</span></a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="menu.html" class="on">Демо-меню</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h2>Меню QR DINE</h2>
  <p>Выберите блюда и оформите заказ.</p>

  <section class="menu" id="menu">
    <p>Загрузка меню...</p>
  </section>

  <h2>Ваша корзина</h2>
  <section class="cart">
    <div id="cart-items">Корзина пуста</div>
    <h3 id="total">Итого: 0 ₸</h3>

    <input id="customer" type="text"
           placeholder="Ваше имя" required>

    <div>
      <button class="btn" onclick="placeOrder()">
        Оформить заказ
      </button>
    </div>

    <p id="message"></p>
  </section>
</main>

<footer>
  <div class="wrap">
    © 2026 QR DINE — заказ без ожидания официанта
  </div>
</footer>

<script>
const cart = [];
let dishes = [];

async function loadMenu() {
  try {
    const response = await fetch("/api/menu");
    if (!response.ok) throw new Error("Ошибка сервера");

    dishes = await response.json();
    const container = document.getElementById("menu");
    container.innerHTML = "";

    dishes.forEach(dish => {
      const card = document.createElement("div");
      card.className = "dish";

      const name = document.createElement("b");
      name.textContent = dish.name;

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = dish.price + " ₸";

      const button = document.createElement("button");
      button.className = "btn";
      button.textContent = "В корзину";
      button.onclick = () => addToCart(dish);

      card.append(name, price, button);
      container.appendChild(card);
    });
  } catch (error) {
    document.getElementById("menu").textContent =
      "Не удалось загрузить меню";
  }
}

function addToCart(dish) {
  cart.push(dish);
  updateCart();
}

function updateCart() {
  const container = document.getElementById("cart-items");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.textContent = "Корзина пуста";
  }

  cart.forEach((dish, index) => {
    const row = document.createElement("div");
    row.className = "cart-item";

    const label = document.createElement("span");
    label.textContent = dish.name + " — " + dish.price + " ₸ ";

    const remove = document.createElement("button");
    remove.textContent = "Удалить";
    remove.onclick = () => {
      cart.splice(index, 1);
      updateCart();
    };

    row.append(label, remove);
    container.appendChild(row);
  });

  const total = cart.reduce(
    (sum, dish) => sum + dish.price, 0
  );
  document.getElementById("total").textContent =
    "Итого: " + total + " ₸";
}

async function placeOrder() {
  const customer = document.getElementById("customer");
  const message = document.getElementById("message");
  const button = document.querySelector(".cart .btn");

  const name = customer.value.trim();

  if (!name || cart.length === 0) {
    message.textContent =
      "Введите имя и добавьте блюда в корзину";
    return;
  }

  button.disabled = true;
  message.textContent = "Отправка заказа...";

  try {
    // Текущий API сохраняет одно блюдо на одну запись.
    // Поэтому отправляем блюда по очереди.
    for (const dish of cart) {
      const response = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: name,
          dish: dish.name
        })
      });

      if (!response.ok) {
        throw new Error("Ошибка сохранения заказа");
      }
    }

    cart.length = 0;
    updateCart();
    customer.value = "";
    message.textContent =
      "Заказ успешно отправлен! Спасибо!";
    message.style.color = "green";

  } catch (error) {
    message.textContent =
      "Ошибка отправки. Проверьте заказ.";
    message.style.color = "red";
  } finally {
    button.disabled = false;
  }
}

loadMenu();
</script>
</body>
</html>
