
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volidam — Мәзір | QR DINE</title>

<style>
:root {
  --green: #102d27;
  --gold: #d6b36a;
  --bg: #f7f6f2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #20342e;
}

header {
  background: var(--green);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header a {
  color: var(--gold);
  text-decoration: none;
}

header h1 { margin-bottom: 8px; }

.container {
  max-width: 1050px;
  margin: auto;
  padding: 25px 15px;
}

.panel {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 22px;
  box-shadow: 0 6px 22px #00000010;
}

.cabins {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cabins a {
  text-align: center;
  padding: 15px 5px;
  border: 1px solid #d9ded6;
  border-radius: 12px;
  text-decoration: none;
  color: var(--green);
  font-weight: bold;
}

.cabins a.active {
  background: var(--green);
  color: white;
}

.foods {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.food {
  padding: 18px;
  border: 1px solid #e4e5de;
  border-radius: 14px;
}

.food h3 { margin-top: 0; }

.price {
  color: #94702e;
  font-weight: bold;
  margin: 12px 0;
}

button {
  background: var(--green);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.cart-item button { padding: 7px 12px; }

input {
  display: block;
  width: 100%;
  max-width: 400px;
  padding: 13px;
  border: 1px solid #ccd4cc;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 16px;
}

#menuPanel, #cartPanel { display: none; }

#result { font-weight: bold; }

@media (min-width: 720px) {
  .cabins {
    grid-template-columns: repeat(6, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="/">← QR DINE</a>
  <h1>VOLIDAM</h1>
  <p id="cabinLabel">Кабинканы таңдаңыз</p>
</header>

<main class="container">

<section class="panel">
  <h2>Кабинкалар</h2>
  <p>Өзіңіздің кабинкаңызды таңдаңыз.</p>
  <div class="cabins" id="cabins"></div>
</section>

<section class="panel" id="menuPanel">
  <h2>Тағамдар мәзірі</h2>
  <p>
    Бұл әзірге демонстрациялық мәзір.
    Volidam-ның нақты мәзірі кейін қосылады.
  </p>
  <p id="menuStatus">Жүктелуде...</p>
  <div class="foods" id="foods"></div>
</section>

<section class="panel" id="cartPanel">
  <h2>Себет</h2>
  <div id="cartItems"></div>

  <h3>Жалпы: <span id="total">0 ₸</span></h3>

  <label for="customer">Атыңыз</label>
  <input
    id="customer"
    placeholder="Атыңызды жазыңыз"
    maxlength="100"
  >

  <button id="send" onclick="sendOrder()">
    Тапсырыс беру
  </button>

  <p id="result"></p>
</section>

</main>

<script>
const params = new URLSearchParams(location.search);
const cabin = Number(params.get("cabin"));

const validCabin =
  Number.isInteger(cabin) &&
  cabin >= 1 &&
  cabin <= 6;

const cart = new Map();
let dishes = [];
let sending = false;

const $ = id => document.getElementById(id);

const money = value =>
  new Intl.NumberFormat("kk-KZ").format(value) + " ₸";

// 6 кабинканы көрсету
for (let i = 1; i <= 6; i++) {
  const link = document.createElement("a");

  link.href = "/menu.html?cabin=" + i;
  link.textContent = "№" + i;

  if (validCabin && cabin === i) {
    link.className = "active";
  }

  $("cabins").appendChild(link);
}

if (validCabin) {
  $("cabinLabel").textContent = "Кабинка №" + cabin;
  $("menuPanel").style.display = "block";
  $("cartPanel").style.display = "block";
  loadMenu();
}

// Серверден мәзір алу
async function loadMenu() {
  try {
    const response = await fetch("/api/menu");

    if (!response.ok) {
      throw new Error("Мәзір жүктелмеді");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Мәзір деректері қате");
    }

    dishes = data.filter(item =>
      Number.isInteger(item.id) &&
      typeof item.name === "string" &&
      Number.isFinite(item.price)
    );

    $("menuStatus").textContent =
      dishes.length ? "" : "Мәзір бос";

    dishes.forEach(item => {
      const card = document.createElement("div");
      card.className = "food";

      const title = document.createElement("h3");
      title.textContent = item.name;

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = money(item.price);

      const button = document.createElement("button");
      button.textContent = "Себетке қосу";

      button.onclick = () => {
        cart.set(item.id, (cart.get(item.id) || 0) + 1);
        renderCart();
      };

      card.append(title, price, button);
      $("foods").appendChild(card);
    });

  } catch (error) {
    $("menuStatus").textContent =
      "Мәзір жүктелмеді. Бетті жаңартыңыз.";
  }
}

// Себетті көрсету
function renderCart() {
  $("cartItems").replaceChildren();

  let total = 0;

  for (const [id, quantity] of cart) {
    const item = dishes.find(d => d.id === id);

    if (!item || quantity <= 0) continue;

    total += item.price * quantity;

    const line = document.createElement("div");
    line.className = "cart-item";

    const name = document.createElement("span");
    name.textContent = item.name + " × " + quantity;

    const controls = document.createElement("div");

    const minus = document.createElement("button");
    minus.textContent = "−";
    minus.onclick = () => {
      if (quantity <= 1) {
        cart.delete(id);
      } else {
        cart.set(id, quantity - 1);
      }
      renderCart();
    };

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.onclick = () => {
      cart.set(id, quantity + 1);
      renderCart();
    };

    const subtotal = document.createElement("span");
    subtotal.textContent = " " + money(item.price * quantity) + " ";

    controls.append(minus, subtotal, plus);
    line.append(name, controls);

    $("cartItems").appendChild(line);
  }

  $("total").textContent = money(total);
  $("send").disabled = sending || total === 0;
}

// Тапсырысты SQLite базасына жіберу
async function sendOrder() {
  if (!validCabin || sending) return;

  const customerName = $("customer").value.trim();

  if (!customerName) {
    $("result").textContent = "Атыңызды жазыңыз!";
    return;
  }

  const orderItems = [];

  for (const [id, quantity] of cart) {
    const item = dishes.find(d => d.id === id);

    if (!item) continue;

    for (let i = 0; i < quantity; i++) {
      orderItems.push(item);
    }
  }

  if (!orderItems.length) return;

  sending = true;
  renderCart();

  let completed = 0;
  let errorMessage = "";

  for (const item of orderItems) {
    try {
      const response = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: customerName,
          dish: item.name,
          cafe_id: 1,
          cabin_number: cabin
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "Тапсырыс сақталмады"
        );
      }

      completed++;

      const remaining = (cart.get(item.id) || 0) - 1;

      if (remaining <= 0) {
        cart.delete(item.id);
      } else {
        cart.set(item.id, remaining);
      }

    } catch (error) {
      errorMessage = error.message;
      break;
    }
  }

  sending = false;
  renderCart();

  if (errorMessage) {
    $("result").textContent =
      completed + " тағам сақталды. Қате: " +
      errorMessage;
  } else {
    $("result").textContent =
      "Тапсырыс қабылданды! Кабинка №" + cabin;
  }
}

renderCart();
</script>

</body>
</html>
