
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLIDAM | QR DINE</title>

<style>
:root {
  --green: #102d27;
  --gold: #d6b36a;
  --bg: #f7f6f2;
  --text: #20342e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  color: var(--gold);
  margin: 0 0 10px;
  font-size: 34px;
  letter-spacing: 2px;
}

header p { margin: 8px 0; }

.container {
  max-width: 1150px;
  margin: auto;
  padding: 20px;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 22px;
  box-shadow: 0 5px 20px #00000010;
}

.cabins, .categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.cabins a, .category {
  border: 1px solid var(--green);
  padding: 12px 18px;
  border-radius: 10px;
  background: white;
  color: var(--green);
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.cabins a.active, .category.active {
  background: var(--green);
  color: white;
}

.categories { margin: 20px 0; }

.foods {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.food {
  border: 1px solid #e4e7df;
  border-radius: 15px;
  overflow: hidden;
  background: white;
  display: flex;
  flex-direction: column;
}

.food-photo {
  width: 100%;
  height: 190px;
  object-fit: cover;
  display: block;
}

.no-photo {
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e7eee8;
  color: #65756d;
  font-size: 45px;
}

.food-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.food h3 {
  font-size: 18px;
  margin: 0 0 12px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  color: #98742e;
  margin-bottom: 15px;
}

button.order {
  margin-top: auto;
  background: var(--green);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 13px;
  font-weight: bold;
  cursor: pointer;
}

button.order:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.cart-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.cart-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cart-controls button {
  border: 1px solid #ccc;
  background: white;
  border-radius: 7px;
  padding: 6px 10px;
  cursor: pointer;
}

input {
  width: 100%;
  max-width: 400px;
  padding: 14px;
  border: 1px solid #cbd4cc;
  border-radius: 10px;
  font-size: 16px;
  margin: 12px 0;
}

.total {
  font-size: 22px;
  font-weight: bold;
}

#menuSection, #cartSection {
  display: none;
}

#message {
  margin-top: 15px;
  font-weight: bold;
}

.note {
  font-size: 13px;
  color: #68756e;
  line-height: 1.5;
}

@media(max-width: 500px) {
  .foods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .food-photo, .no-photo { height: 135px; }
  .food-content { padding: 10px; }
  .food h3 { font-size: 15px; }
  .price { font-size: 17px; }
  .cart-line { flex-wrap: wrap; }
}
</style>
</head>

<body>

<header>
  <h1>VOLIDAM</h1>
  <p>Дәм мен жайлылық мекені</p>
  <p id="cabinTitle">Кабинканы таңдаңыз</p>
</header>

<div class="container">

  <section class="panel">
    <h2>Кабинкалар</h2>
    <div class="cabins" id="cabins"></div>
  </section>

  <section class="panel" id="menuSection">
    <h2>Біздің мәзір</h2>
    <div class="categories" id="categories"></div>
    <p id="menuStatus">Мәзір жүктелуде...</p>
    <div class="foods" id="foods"></div>
  </section>

  <section class="panel" id="cartSection">
    <h2>🛒 Себет</h2>

    <div id="cartItems"></div>

    <p>Тағамдар: <b id="subtotal">0 ₸</b></p>
    <p>Қызмет көрсету (10%): <b id="service">0 ₸</b></p>
    <p class="total">Жалпы: <span id="total">0 ₸</span></p>

    <p class="note">
      10% қызмет ақысы экранда есептеледі.
      Серверге тағамдардың негізгі бағасы жіберіледі.
    </p>

    <label for="customer">Атыңыз:</label>
    <br>
    <input id="customer" placeholder="Атыңызды енгізіңіз">

    <br>
    <button class="order" id="sendOrder" onclick="submitOrder()">
      Тапсырыс беру
    </button>

    <p id="message"></p>
  </section>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const cabin = Number(params.get("cabin"));

const validCabin =
  Number.isInteger(cabin) &&
  cabin >= 1 &&
  cabin <= 6;

const categories = [
  "Ассорти",
  "Салаттар",
  "Шашлық",
  "Сусындар"
];

const photos = {
  "Мясной ассорти": "myasnoy.jpeg",
  "Фруктовое ассорти": "fruktovoe.jpeg",
  "Чикен": "chiken.jpeg",

  "Острый": "ostry.jpeg",
  "Цезарь": "cezar.jpeg",
  "Хрустящие баклажаны": "baklazhany.jpeg",
  "Фруктовый": "fruktoviy.jpeg",
  "Свежий": "svezhiy.jpeg",
  "Ачичук": "achichuk.jpeg",
  "Мужской каприз": "muzhskoy.jpeg",

  "Кусковой": "shashlyk(kuska).jpeg",
  "Фарш": "shashlyk(farsh).jpeg",
  "Окорочка (крылышки)": "okorochka.jpeg",
  "Кабырга": "kabyrga.jpeg",

  "Кола 1 л": "cola.jpeg",
  "Кола 1,5 л": "cola.jpeg",
  "Пепси 1 л": "pepsi.jpeg",
  "Пепси 1,5 л": "pepsi.jpeg",
  "Макси чай": "maxi.jpeg",
  "Спрайт": "sprite.jpeg",
  "Фанта": "fanta.jpeg",
  "Пико морс": "piko.jpeg",
  "Фьюсти чай": "fuzetea.jpeg",
  "Махито (кувшин)": "mohito.jpeg",
  "Зеленый чай": "green-tea.jpeg",
  "Черный чай": "black-tea.jpeg",
  "Ташкентский чай": "tashkent-tea.jpeg",
  "Кофе": "coffee.jpeg",
  "DIZZY": "dizzy.jpeg",
  "GORILLA": "gorilla.jpeg"
};

const categoryIcons = {
  "Ассорти": "🍖",
  "Салаттар": "🥗",
  "Шашлық": "🔥",
  "Сусындар": "🥤"
};

let dishes = [];
let cart = new Map();
let currentCategory = "Ассорти";
let sending = false;

const money = n =>
  new Intl.NumberFormat("kk-KZ").format(n) + " ₸";

const el = id => document.getElementById(id);

// 6 кабинка
for (let i = 1; i <= 6; i++) {
  const link = document.createElement("a");

  link.href = "/menu.html?cabin=" + i;
  link.textContent = "Кабинка №" + i;

  if (validCabin && cabin === i) {
    link.classList.add("active");
  }

  el("cabins").appendChild(link);
}

if (validCabin) {
  el("cabinTitle").textContent = "Кабинка №" + cabin;
  el("menuSection").style.display = "block";
  el("cartSection").style.display = "block";
  loadMenu();
}

// Категориялар
function renderCategories() {
  const container = el("categories");
  container.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "category";
    button.textContent =
      categoryIcons[category] + " " + category;

    if (currentCategory === category) {
      button.classList.add("active");
    }

    button.onclick = () => {
      currentCategory = category;
      renderCategories();
      renderFoods();
    };

    container.appendChild(button);
  });
}

// Тағамдар мен фотолар
function renderFoods() {
  const container = el("foods");
  container.replaceChildren();

  const filtered = dishes.filter(
    d => d.category === currentCategory
  );

  el("menuStatus").textContent =
    filtered.length ? "" : "Бұл категорияда тағам жоқ";

  filtered.forEach(d => {
    const card = document.createElement("div");
    card.className = "food";
    const photoName =
  d.name.toLowerCase().includes("пепси")
    ? "pepsi.jpeg"
    : photos[d.name];

    const placeholder = document.createElement("div");
    placeholder.className = "no-photo";
    placeholder.textContent =
      categoryIcons[d.category] || "🍽️";

    if (photoName) {
      const img = document.createElement("img");
      img.className = "food-photo";
      img.src = "/" + photoName;
      img.alt = d.name;
      img.loading = "lazy";

      img.onerror = () => {
        img.replaceWith(placeholder);
      };

      card.appendChild(img);
    } else {
      card.appendChild(placeholder);
    }

    const content = document.createElement("div");
    content.className = "food-content";

    const title = document.createElement("h3");
    title.textContent = d.name;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(d.price);

    const button = document.createElement("button");
    button.className = "order";
    button.textContent = "Себетке қосу";

    button.onclick = () => {
      cart.set(d.id, (cart.get(d.id) || 0) + 1);
      renderCart();
    };

    content.append(title, price, button);
    card.appendChild(content);
    container.appendChild(card);
  });
}

// Серверден мәзірді алу
async function loadMenu() {
  try {
    const response = await fetch("/api/menu");

    if (!response.ok) {
      throw new Error("Сервер қатесі");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Мәзір дұрыс емес");
    }

    dishes = data
      .map(d => ({
        ...d,
        id: Number(d.id),
        price: Number(d.price)
      }))
      .filter(d =>
        Number.isInteger(d.id) &&
        typeof d.name === "string" &&
        Number.isFinite(d.price) &&
        categories.includes(d.category)
      );

    renderCategories();
    renderFoods();

  } catch (error) {
    el("menuStatus").textContent =
      "Мәзір жүктелмеді. Бетті жаңартып көріңіз.";
  }
}

// Себет
function renderCart() {
  const container = el("cartItems");
  container.replaceChildren();

  let subtotal = 0;

  for (const [id, quantity] of cart) {
    const dish = dishes.find(d => d.id === id);

    if (!dish || quantity <= 0) continue;

    subtotal += dish.price * quantity;

    const line = document.createElement("div");
    line.className = "cart-line";

    const name = document.createElement("span");
    name.textContent =
      dish.name + " × " + quantity;

    const controls = document.createElement("div");
    controls.className = "cart-controls";

    const minus = document.createElement("button");
    minus.textContent = "−";

    minus.onclick = () => {
      if (quantity <= 1) {
        cart.delete(id);
      } else {
        cart.set(id, quantity - 1);
      }

      renderCart();
    };

    const sum = document.createElement("span");
    sum.textContent =
      money(dish.price * quantity);

    const plus = document.createElement("button");
    plus.textContent = "+";

    plus.onclick = () => {
      cart.set(id, quantity + 1);
      renderCart();
    };

    controls.append(minus, sum, plus);
    line.append(name, controls);
    container.appendChild(line);
  }

  const service = Math.round(subtotal * 0.10);

  el("subtotal").textContent = money(subtotal);
  el("service").textContent = money(service);
  el("total").textContent = money(subtotal + service);

  el("sendOrder").disabled =
    sending || subtotal === 0;
}

// Тапсырыс жіберу
async function submitOrder() {
  if (sending || !validCabin) return;

  const customer = el("customer").value.trim();

  if (!customer) {
    el("message").textContent =
      "Алдымен атыңызды жазыңыз!";
    return;
  }

  const items = [];

  for (const [id, quantity] of cart) {
    const dish = dishes.find(d => d.id === id);

    if (!dish) continue;

    for (let i = 0; i < quantity; i++) {
      items.push({
        id: dish.id,
        name: dish.name
      });
    }
  }

  if (items.length === 0) return;

  sending = true;
  renderCart();

  let saved = 0;
  let errorMessage = "";

  for (const item of items) {
    try {
      const response = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: customer,
          dish: item.name,
          cafe_id: 1,
          cabin_number: cabin
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "Тапсырыс сақталмады"
        );
      }

      saved++;

      const remaining =
        (cart.get(item.id) || 0) - 1;

      if (remaining <= 0) {
        cart.delete(item.id);
      } else {
        cart.set(item.id, remaining);
      }

    } catch (error) {
      errorMessage = error.message;
      break;
    }
  }

  sending = false;
  renderCart();

  if (errorMessage) {
    el("message").textContent =
      saved + " тағам сақталды. Қате: " +
      errorMessage;
    el("message").style.color = "red";
  } else {
    el("message").textContent =
      "Тапсырыс қабылданды! Кабинка №" +
      cabin;
    el("message").style.color = "green";
  }
}

renderCart();
</script>

</body>
</html>
