
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тіркелу — QR DINE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .register-box {
      max-width: 420px;
      margin: 70px auto;
      padding: 35px;
      background: #102b25;
      color: white;
      border-radius: 18px;
    }
    .register-box h1 {
      color: #e8c477;
      text-align: center;
    }
    .register-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .register-box button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #e8c477;
      color: #102b25;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      margin-top: 15px;
      text-align: center;
    }
    .social-login {
  margin-top: 25px;
}

.divider-text {
  text-align: center;
  color: #b9c9c3;
  margin-bottom: 18px;
}

.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  margin-top: 12px;
  background: white;
  color: #172b25;
  text-decoration: none;
  border-radius: 9px;
  font-weight: bold;
  transition: 0.2s;
}

.social-btn:hover {
  background: #e8c477;
  transform: translateY(-2px);
}

.google-icon {
  color: #4285f4;
  font-size: 22px;
  font-weight: bold;
}

.facebook-icon {
  color: #1877f2;
  font-size: 24px;
  font-weight: bold;
}

.apple-icon {
  color: black;
  font-size: 20px;
}
  </style>
</head>
<body>

<div class="register-box">
  <h1>QR DINE</h1>
  <h2>Тіркелу</h2>

  <form id="registerForm">
    <input id="name" placeholder="Аты-жөніңіз"
           required maxlength="100">

    <input id="email" type="email"
           placeholder="Email" required>

    <input id="password" type="password"
           placeholder="Құпиясөз (кемінде 8 таңба)"
           minlength="8" required>

    <button type="submit">Тіркелу</button>
  </form>
  <div class="social-login">
  <p class="divider-text">немесе аккаунт арқылы жалғастыру</p>

  <a href="/auth/google" class="social-btn">
    <span class="google-icon">G</span>
    Google арқылы жалғастыру
  </a>

  <a href="/auth/facebook" class="social-btn">
    <span class="facebook-icon">f</span>
    Facebook арқылы жалғастыру
  </a>

  <a href="/auth/apple" class="social-btn">
    <span class="apple-icon">●</span>
    Apple ID арқылы жалғастыру
  </a>
</div>

  <p id="message" role="status"></p>
  <p><a href="index.html" style="color:#e8c477">
    ← Басты бетке
  </a></p>
</div>

<script>
document.getElementById("registerForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    message.textContent = "Тіркеліп жатыр...";

    try {
      const response = await fetch("/api/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "same-origin",
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });

      const result = await response.json();

      if (response.ok) {
        message.textContent = "Тіркелу сәтті өтті!";
        message.style.color = "#a8f0c6";
        document.getElementById("registerForm").reset();
      } else {
        message.textContent = result.error || "Қате пайда болды";
        message.style.color = "#ffb4b4";
      }
    } catch (error) {
      message.textContent = "Сервермен байланыс қатесі";
      message.style.color = "#ffb4b4";
    }
  });
</script>

</body>
</html>
